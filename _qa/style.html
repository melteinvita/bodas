<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>QA styles</title>
<style>html,body{margin:0;background:#111;color:#eee;font:12px/1.5 Consolas,monospace}pre{padding:12px;white-space:pre-wrap}iframe{position:fixed;left:-9999px;top:0;border:0;width:390px;height:800px}</style>
</head>
<body>
<pre id="report">midiendo…</pre>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('id') || 'lotr';
  var f = document.createElement('iframe');
  f.src = '../invitacion.html?demo=' + id + '&preview=1&lang=es';
  var out = [];
  f.onload = function () {
    var doc = f.contentDocument, win = f.contentWindow;
    var st = doc.createElement('style');
    st.textContent = '#envelope-overlay,#invite-status,.music-toggle,.lang-switcher{display:none!important}';
    doc.head.appendChild(st);
    setTimeout(function () {
      var foot = doc.querySelector('.invite-footer');
      var h3 = doc.querySelector('.invite-footer h3');
      var link = doc.querySelector('.footer-legal a');
      var cs = win.getComputedStyle(foot);
      out.push('body.class = ' + doc.body.className);
      out.push('footer bg = ' + cs.backgroundColor + ' | color = ' + cs.color + ' | border = ' + cs.borderTop);
      out.push('h3 color = ' + win.getComputedStyle(h3).color + ' | font = ' + win.getComputedStyle(h3).fontFamily);
      out.push('link color = ' + win.getComputedStyle(link).color);
      out.push('footer rect = ' + JSON.stringify(foot.getBoundingClientRect()));
      out.push('sheet rules = ' + doc.styleSheets.length + ' | css href = ' + (doc.styleSheets[0] && doc.styleSheets[0].href));
      document.getElementById('report').textContent = out.join('\n');
    }, 1200);
  };
  document.body.appendChild(f);
})();
</script>
</body>
</html>
