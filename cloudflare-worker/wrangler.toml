#:schema node_modules/wrangler/config-schema.json
name = "estudio-oliva-invitaciones"
main = "worker.js"
compatibility_date = "2025-09-01"

# Sirve la carpeta del proyecto como web estática. `wrangler` se ejecuta
# desde esta carpeta, por eso la ruta es "..".
[assets]
directory = ".."
binding = "ASSETS"
run_worker_first = ["/i/*", "/invitacion.html"]

[vars]
SUPABASE_URL = "https://TU-PROYECTO.supabase.co"
SUPABASE_ANON_KEY = "TU_CLAVE_PUBLISHABLE"
SITE_URL = "https://TU-DOMINIO.es"

# La clave publishable/anon es pública por diseño. Si prefieres no
# versionarla, bórrala de [vars] y ejecuta:
#   npx wrangler secret put SUPABASE_ANON_KEY
#   npx wrangler secret put SUPABASE_URL
